---
# 1. Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapp-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskapp-backend
  template:
    metadata:
      labels:
        app: taskapp-backend
    spec:
      containers:
      - name: backend
        image: node:18-alpine
        command: ["node", "-e", "require('http').createServer((req, res) => {res.writeHead(200); res.end('Backend running'); }).listen(5000);"]
        ports:
        - containerPort: 5000

---
# 2. Backend Service (Named 'backend' for frontend Nginx discovery)
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: taskapp-backend

---
# 3. Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapp-frontend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskapp-frontend
  template:
    metadata:
      labels:
        app: taskapp-frontend
    spec:
      containers:
      - name: frontend
        image: nginx:alpine
        ports:
        - containerPort: 80

---
# 4. Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: taskapp-frontend

---
# 5. Ingress Controller Routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskapp-ingress
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80

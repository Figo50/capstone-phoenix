# TEMPLATE ONLY. Your .gitignore already blocks *secret*.yaml from being
# committed (except this .example.yaml file itself) - that's intentional.
#
# To use: copy this file, fill in real values, apply it directly to the
# cluster. Do NOT rename it to drop ".example" and do NOT commit the real one.
#
#   cp manifests/app/02-secret.example.yaml /tmp/taskapp-secret.yaml
#   nano /tmp/taskapp-secret.yaml   # fill in real values
#   kubectl apply -f /tmp/taskapp-secret.yaml
#   rm /tmp/taskapp-secret.yaml     # don't leave the real one lying around either
#
# This is the "Core, non-negotiable" version of the Secret requirement.
# The Sealed Secrets / External Secrets stretch goal replaces this manual
# apply with something that CAN be committed safely - do that later if you
# want the stretch points, but it's not required to pass Milestone 2.

apiVersion: v1
kind: Secret
metadata:
  name: taskapp-secret
  namespace: taskapp
type: Opaque
stringData:
  DATABASE_USER: "taskapp"
  DATABASE_PASSWORD: "REPLACE_ME_with_a_real_password"
  # Generate a real one yourself, don't hand-type something guessable:
  #   openssl rand -base64 32
  SECRET_KEY: "REPLACE_ME_run_openssl_rand_base64_32"

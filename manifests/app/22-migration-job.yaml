# Run-once migration Job. Deliberately NOT part of the backend Deployment's
# entrypoint - at 2+ replicas, migrations in the entrypoint race each other
# on `alembic upgrade head` (this exact race is flagged in the rubric).
#
apiVersion: batch/v1
kind: Job
metadata:
  name: taskapp-migrate
  namespace: taskapp
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: ghcr.io/ts-a-devops/taskapp-backend:5d6b8fc   # same pinned image as the app
        command: ["alembic", "upgrade", "head"]
        envFrom:
        - configMapRef:
            name: taskapp-config
        - secretRef:
            name: taskapp-secret
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
